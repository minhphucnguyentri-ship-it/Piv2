<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter from my heart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Inter:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#0a0006;
    --crim:#8a0b34;
    --crim2:#5e0722;
    --gold:#e6c36a;
    --paper:#fbf8f4;
    --ink:#4a3b3b;
    --rose:#f3a6bf;
}

* { box-sizing:border-box; }

html,body { height:100%; margin:0; }

body {
    background:radial-gradient(90% 60% at 50% 45%,#2a0212,var(--bg));
    font-family:"Cormorant Garamond",Georgia,serif;
    color:var(--rose);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

#petals {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.title {
    font-family:"Great Vibes",cursive;
    font-size:clamp(34px,8vw,52px);
    color:var(--gold);
    margin:0;
    text-align:center;
}

.sub {
    font-size:13px;
    letter-spacing:.25em;
    color:#d7a8b4;
    margin:2px 0 26px;
    text-align:center;
}

.env {
    position:relative;
    width:min(92vw,430px);
    aspect-ratio:1.5/1;
    perspective:900px;
    z-index:1;
    overflow:visible;
}

.body {
    position:absolute;
    inset:0;
    background:linear-gradient(160deg,#a10f3e,var(--crim2));
    border-radius:6px;
    box-shadow:0 20px 60px #000c,0 0 90px #8a0b3433;
    overflow:hidden;
    z-index:1;
}

.body::before,
.body::after {
    content:"";
    position:absolute;
    bottom:0;
    width:50%;
    height:100%;
}

.body::before {
    left:0;
    background:linear-gradient(to top right,#00000030 49.5%,transparent 50%);
}

.body::after {
    right:0;
    background:linear-gradient(to top left,#00000030 49.5%,transparent 50%);
}

/* Nắp phong bì */
.flap {
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:58%;
    transform-origin:top center;
    transition:transform .9s ease,z-index 0s .45s;
    z-index:5;
}

.flap i {
    position:absolute;
    inset:0;
    background:linear-gradient(#b01244,#7d0a2e);
    clip-path:polygon(0 0,100% 0,50% 100%);
    filter:drop-shadow(0 4px 6px #0006);
}

.env.open .flap {
    transform:rotateX(180deg);
    z-index:0;
}

/* Trái tim niêm phong */
.seal {
    position:absolute;
    left:50%;
    top:58%;
    width:54px;
    height:54px;
    margin:-27px 0 0 -27px;
    border-radius:50%;
    border:0;
    background:radial-gradient(circle at 35% 30%,#ff5c8d,#b3123f 70%);
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:6;
    box-shadow:0 6px 16px #000a,inset 0 -3px 6px #0005;
    animation:pulse 2s ease-in-out infinite;
    transition:opacity .4s;
}

.env.open .seal {
    opacity:0;
    pointer-events:none;
    animation:none;
}

@keyframes pulse {
    50% { transform:scale(1.08); }
}

.hint {
    margin-top:30px;
    font-style:italic;
    font-size:15px;
    color:#c78a9c;
    position:relative;
    z-index:1;
    transition:opacity .4s;
}

/* Lá thư */
.card {
    position:absolute;
    left:50%;
    bottom:12px;
    width:min(96vw,470px);
    transform:translate(-50%,0) scale(.78);
    opacity:0;
    pointer-events:none;
    transition:transform 1s ease,opacity .35s ease;
    z-index:0; /* nằm sau thân phong bì để trông như đang rút ra */
}

.sheet {
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    padding:14px 20px 16px;
    box-shadow:0 24px 70px #000c;
    position:relative;
}

.bar {
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Inter,system-ui,sans-serif;
    font-size:11px;
    letter-spacing:.14em;
    color:#8b7b7b;
    position:relative;
    padding-bottom:10px;
    border-bottom:1px solid #eadfdc;
}

.x {
    position:absolute;
    right:-6px;
    top:-4px;
    background:none;
    border:0;
    font-size:20px;
    color:#8b7b7b;
    cursor:pointer;
}

.page {
    min-height:clamp(170px,25vh,220px);
    padding:14px 12px 8px 0;
    border-right:3px solid var(--gold);
    margin-top:6px;
    transition:opacity .25s;
}

.page.out { opacity:0; }

.page h2 {
    font-family:"Great Vibes",cursive;
    font-weight:400;
    color:var(--crim);
    font-size:36px;
    margin:0 0 6px;
}

.page p {
    margin:0;
    font-size:19px;
    line-height:1.5;
    padding-right:12px;
}

.nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:8px;
}

.btn {
    font-family:Inter,system-ui,sans-serif;
    font-size:12px;
    font-weight:600;
    border-radius:999px;
    padding:8px 14px;
    cursor:pointer;
    border:1px solid #e2cfd3;
    background:white;
    color:var(--crim);
}

.btn.primary {
    background:var(--crim);
    color:white;
    border-color:var(--crim);
}

.btn:disabled {
    opacity:.4;
    cursor:default;
}

/* Ảnh Polaroid */
.photo {
    position:absolute;
    right:-2px;
    bottom:-95px;
    width:104px;
    --dx:0px;
    --dy:0px;
    --s:1;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease,transform .75s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease;
    background:white;
    padding:7px 7px 18px;
    transform:translate(0,0) rotate(5deg) scale(1);
    box-shadow:0 10px 26px #0008,0 0 0 0 rgba(10,0,6,0);
    border:0;
    cursor:pointer;
    text-align:center;
    font-family:"Great Vibes",cursive;
    font-size:13px;
    color:var(--ink);
    z-index:8;
}

/* Ảnh hiện ra sau khi thư đã đặt xong, ẩn đi khi đóng thư */
.env.letter-up .photo {
    opacity:1;
    pointer-events:auto;
    transition:opacity .6s ease 1.7s,transform .75s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease;
}

.env.letter-up.closing .photo {
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease,transform .75s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease;
}

/* Bấm vào ảnh: bay ra giữa màn hình, phóng to, nền xung quanh tối lại */
.photo.zoom {
    transform:translate(var(--dx),var(--dy)) rotate(-2deg) scale(var(--s));
    box-shadow:0 10px 26px #0008,0 0 0 150vmax rgba(10,0,6,.78);
    cursor:zoom-out;
}

.photo div {
    height:84px;
    background:linear-gradient(135deg,#f3a6bf,#8a0b34);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:white;
    background-size:cover;
    background-position:center;
}

    margin-top:3px;

/* Màn hình trái tim ban đầu */
.intro {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    background:radial-gradient(ellipse at center,#350518 0%,#16000a 52%,#0a0006 100%);
    transition:opacity .85s ease,visibility .85s ease;
}

.intro.hide {
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.big-heart {
    width:clamp(150px,42vw,250px);
    aspect-ratio:1;
    border:0;
    background:transparent;
    color:#ff3f79;
    cursor:pointer;
    position:relative;
    display:grid;
    place-items:center;
    filter:drop-shadow(0 0 12px #ff1e62aa) drop-shadow(0 0 34px #e6004f77);
    animation:heartBeat 1.35s ease-in-out infinite;
}

.big-heart::before,
.big-heart::after {
    content:"";
    position:absolute;
    inset:12%;
    border:1px solid #ff8eae55;
    border-radius:50%;
    animation:heartRipple 2.8s ease-out infinite;
}

.big-heart::after { animation-delay:1.4s; }

.big-heart span {
    display:block;
    font-family:Georgia,serif;
    font-size:clamp(130px,37vw,220px);
    line-height:1;
    color:#ed245f;
    text-shadow:0 0 8px #ff9ab8,0 0 24px #ff2468,0 0 55px #c90049;
}

.intro-hint {
    margin:0;
    color:#e8a0b5;
    font-size:14px;
    letter-spacing:.18em;
    text-transform:uppercase;
    animation:hintGlow 2s ease-in-out infinite;
}

.stage {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transform:scale(.97);
    transition:opacity .9s ease,transform .9s ease,visibility .9s;
}

.stage.ready {
    opacity:1;
    visibility:visible;
    transform:scale(1);
}

@keyframes heartBeat {
    0%,100% {transform:scale(1)}
    14% {transform:scale(1.09)}
    28% {transform:scale(1)}
    42% {transform:scale(1.06)}
    56% {transform:scale(1)}
}

@keyframes heartRipple {
    0% { transform:scale(.65); opacity:.65; }
    100% { transform:scale(1.8); opacity:0; }
}

@keyframes hintGlow {
    0%,100% {opacity:.55}
    50% {opacity:1}
}

/* Trình tự animation phong bì */
.stage.letter-open .title,
.stage.letter-open .sub,
.stage.letter-open .hint {
    opacity:0;
    visibility:hidden;
    transition:opacity .35s ease;
}

/* Giai đoạn 3 + 5 gộp làm một: thư trượt ra, đi lên rồi hạ xuống đè lên phong bì (2s) */
.env.letter-up .card {
    --final-y:-50px;   /* vị trí cuối: càng gần 0 thì thư càng nằm sâu trong phong bì */
    --final-s:1;
    opacity:1;
    transform:translate(-50%,var(--final-y)) scale(var(--final-s));
    pointer-events:auto;
    z-index:7;
    animation:letterOut 2s ease-in-out forwards;
}

.env.letter-up.closing .card {
    animation:letterIn 2s ease-in-out forwards;
}

@keyframes letterOut {
    0%   { transform:translate(-50%,0) scale(.78); opacity:0; z-index:0; }
    12%  { opacity:1; }
    66%  { z-index:0; }
    /* thư đã cao hơn miệng phong bì -> chuyển lên lớp trên cùng */
    67%  { transform:translate(-50%,-290px) scale(.9); opacity:1; z-index:7; }
    100% { transform:translate(-50%,var(--final-y)) scale(var(--final-s)); opacity:1; z-index:7; }
}

@keyframes letterIn {
    0%   { transform:translate(-50%,var(--final-y)) scale(var(--final-s)); opacity:1; z-index:7; }
    33%  { transform:translate(-50%,-290px) scale(.9); opacity:1; z-index:7; }
    34%  { z-index:0; }
    88%  { opacity:1; }
    100% { transform:translate(-50%,0) scale(.78); opacity:0; z-index:0; }
}

.env.letter-up .seal {
    opacity:0;
    pointer-events:none;
}

@media(max-width:520px) {
    .env { width:min(92vw,390px); }
    .card { width:calc(100vw - 12px); }
    .sheet { padding:13px 17px 15px; }
    .page { min-height:clamp(165px,25vh,205px); }
    .page h2 { font-size:34px; }
    .page p { font-size:18px; line-height:1.48; }
    .nav { gap:5px; margin-top:10px; }
    .btn { font-size:11px; padding:8px 11px; }
    .photo { right:-2px; bottom:-90px; width:96px; }
    .env.letter-up .card { --final-y:-50px; --final-s:.94; }
}

@media(max-height:650px) {
    .page { min-height:clamp(125px,22vh,180px); }
    .photo { bottom:-80px; width:88px; }
    .env.letter-up .card { --final-y:-40px; --final-s:.88; }
}

@media(prefers-reduced-motion:reduce) {
    * {
        transition:none!important;
        animation:none!important;
    }
}
</style>
</head>

<body>

<canvas id="petals" aria-hidden="true"></canvas>

<!-- Màn hình trái tim -->
<section class="intro" id="intro">
    <button class="big-heart" id="start">
        <span>&#10084;</span>
    </button>
    <p class="intro-hint">Touch the heart to begin</p>
</section>

<!-- Giao diện phong bì -->
<main class="stage" id="stage">

<h1 class="title">A letter from my heart</h1>
<p class="sub">Written just for you</p>

<div class="env" id="env">

    <div class="body"></div>

    <div class="flap">
        <i></i>
    </div>

    <button class="seal" id="seal">&#10084;</button>

    <!-- Lá thư -->
    <section class="card" id="card">
        <div class="sheet">

            <div class="bar">
                <span id="pg">PAGE 1 OF 3</span>
                <button class="x" id="x">&times;</button>
            </div>

            <div class="page" id="page"></div>

            <div class="nav">
                <button class="btn" id="prev">&larr; Previous</button>
                <button class="btn" id="close">Close</button>
                <button class="btn primary" id="next">Next page &rarr;</button>
            </div>

        </div>
    </section>

    <!-- Ảnh Polaroid: gắn với phong bì, không dính vào lá thư -->
    <div class="photo" id="photo" role="button" tabindex="0" aria-label="Open photo">
        <div id="pic"></div>
        <span>forever &amp; always &#10084;</span>
    </div>

    <input type="file" id="file" accept="image/*" hidden>

</div>

<p class="hint" id="hint">Tap the seal to open</p>

</main>

<script>
(function(){

// Nội dung thư
var PAGES = [
    {
        h:"My Dearest,",
        t:"In a world that moves far too fast, you have become my favorite pause. I still remember the exact moment you entered my life — it felt as though all the background noise of the world quietly vanished, leaving only the warmth of your presence."
    },
    {
        h:"",
        t:"You make ordinary days feel like small celebrations. The way you laugh at your own jokes, the way you hold my hand without thinking — these are the things I carry with me, long after the day is done."
    },
    {
        h:"Forever yours,",
        t:"I don’t have grand words big enough for what you mean to me, so I’ll say it plainly: thank you for being you, and for letting me love you. Whatever comes next, I choose you — today, tomorrow, and always."
    }
];

// Thời gian (ms) của từng bước
var T_FLAP  = 900;   // 1. nắp phong bì mở (khớp transition .9s)
var T_WAIT1 = 500;   // 2. chờ 0,5 giây
var T_CARD  = 2000;  // 3+4+5. thư trượt ra + đi lên, một animation liền mạch (khớp animation 2s)

var i = 0;

var env = document.getElementById('env');
var card = document.getElementById('card');
var page = document.getElementById('page');

var intro = document.getElementById('intro');
var stage = document.getElementById('stage');

var pg = document.getElementById('pg');
var prev = document.getElementById('prev');
var next = document.getElementById('next');
var hint = document.getElementById('hint');

// Bấm trái tim lớn
document.getElementById('start').onclick = function(){
    intro.classList.add('hide');
    stage.classList.add('ready');
};

// Hiển thị nội dung trang
function render(){

    page.classList.add('out');

    setTimeout(function(){

        var p = PAGES[i];

        page.innerHTML = '';

        if(p.h){
            var h = document.createElement('h2');
            h.textContent = p.h;
            page.appendChild(h);
        }

        var t = document.createElement('p');
        t.textContent = p.t;
        page.appendChild(t);

        pg.textContent = 'PAGE ' + (i+1) + ' OF ' + PAGES.length;

        prev.disabled = i === 0;
        next.disabled = i === PAGES.length-1;

        page.classList.remove('out');

    },180);
}

// Mở phong bì theo từng giai đoạn
function open(){

    if(env.classList.contains('open')) return;

    env.classList.add('open');            // 1. Nắp phong bì mở
    stage.classList.add('letter-open');

    hint.style.opacity = 0;

    i = 0;
    render();

    // 2. Chờ 0,5 giây sau khi nắp mở xong
    setTimeout(function(){

        // 3 + 4 + 5. Thư trượt ra rồi đi lên trên phong bì (một animation)
        env.classList.add('letter-up');

        setTimeout(function(){
            next.focus();
        }, T_CARD);

    }, T_FLAP + T_WAIT1);
}

// Đóng thư (chạy ngược lại)
function close(){

    zoomOut();

    env.classList.add('closing');          // thư hạ vào lại phong bì

    setTimeout(function(){

        env.classList.remove('letter-up','closing');
        env.classList.remove('open');
        stage.classList.remove('letter-open');

        hint.style.opacity = 1;

    }, T_CARD);
}

// Sự kiện nút
document.getElementById('seal').onclick = open;

document.getElementById('close').onclick = close;
document.getElementById('x').onclick = close;

prev.onclick = function(){
    if(i > 0){
        i--;
        render();
    }
};

next.onclick = function(){
    if(i < PAGES.length-1){
        i++;
        render();
    }
};

// Điều khiển bằng bàn phím
document.addEventListener('keydown',function(e){

    if(e.key === 'Escape' && photo.classList.contains('zoom')){
        zoomOut();
        return;
    }

    if(!env.classList.contains('letter-up')) return;

    if(e.key === 'Escape') close();

    if(e.key === 'ArrowRight') next.click();

    if(e.key === 'ArrowLeft') prev.click();

});

// Tải ảnh Polaroid
var file = document.getElementById('file');
var pic = document.getElementById('pic');

var photo = document.getElementById('photo');
var photoBusy = false;

// Phóng to: ảnh bay ra giữa màn hình
function zoomIn(){

    var w = photo.offsetWidth;
    var h = photo.offsetHeight;
    var r = photo.getBoundingClientRect();

    var cx = r.left + r.width/2;
    var cy = r.top + r.height/2;

    var s = Math.min(320/w, innerWidth*.82/w, innerHeight*.7/h);

    photo.style.setProperty('--dx',(innerWidth/2 - cx) + 'px');
    photo.style.setProperty('--dy',(innerHeight/2 - 24 - cy) + 'px');
    photo.style.setProperty('--s',s);

    photo.classList.add('zoom');
}

// Thu nhỏ: ảnh quay về chỗ cũ trên phong bì
function zoomOut(){
    photo.classList.remove('zoom');
}

photo.onclick = function(){

    if(photoBusy) return;

    photoBusy = true;
    setTimeout(function(){ photoBusy = false; },760);

    if(photo.classList.contains('zoom')) zoomOut();
    else zoomIn();
};

photo.addEventListener('keydown',function(e){
    if(e.target === photo && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        photo.click();
    }
});

// Bấm ra ngoài ảnh để thu nhỏ lại
document.addEventListener('click',function(e){

    if(!photo.classList.contains('zoom') || photoBusy) return;

    if(e.target.closest('#photo') || e.target === file) return;

    zoomOut();
});

addEventListener('resize',zoomOut);

file.onchange = function(){

    var f = file.files[0];

    if(!f) return;

    var r = new FileReader();

    r.onload = function(){
        pic.style.backgroundImage = 'url(' + r.result + ')';
        pic.textContent = '';
    };

    r.readAsDataURL(f);
};

// Hiệu ứng cánh hoa rơi
var cv = document.getElementById('petals');
var ctx = cv.getContext('2d');

var W,H;
var dpr = Math.min(window.devicePixelRatio || 1,2);
var pt = [];

function size(){

    W = innerWidth;
    H = innerHeight;

    cv.width = W*dpr;
    cv.height = H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

size();
addEventListener('resize',size);

for(var k=0;k<38;k++){

    pt.push({
        x:Math.random()*W,
        y:Math.random()*H,
        s:4+Math.random()*7,
        v:12+Math.random()*28,
        d:Math.random()*6,
        r:Math.random()*6,
        a:.15+Math.random()*.4
    });

}

var still = matchMedia('(prefers-reduced-motion:reduce)').matches;
var lt = 0;

function loop(n){

    var dt = Math.min((n-lt)/1000 || .016,.05);

    lt = n;

    ctx.clearRect(0,0,W,H);

    for(var j=0;j<pt.length;j++){

        var p = pt[j];

        if(!still){
            p.y += p.v*dt;
            p.x += Math.sin(n/1500+p.d)*12*dt;
            p.r += dt;
        }

        if(p.y > H+10){
            p.y = -10;
            p.x = Math.random()*W;
        }

        ctx.save();

        ctx.translate(p.x,p.y);
        ctx.rotate(p.r);

        ctx.fillStyle = 'rgba(200,30,80,'+p.a+')';

        ctx.beginPath();

        ctx.moveTo(0,p.s*.4);

        ctx.bezierCurveTo(-p.s,-p.s*.6,-p.s*.2,-p.s,0,-p.s*.3);
        ctx.bezierCurveTo(p.s*.2,-p.s,p.s,-p.s*.6,0,p.s*.4);

        ctx.fill();
        ctx.restore();

    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

})();
</script>

</body>
</html>
